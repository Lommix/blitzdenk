<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Blitzdenk — the tiny harness that shapes itself to your project</title>
  <desc id="desc">A 1.7 megabyte native AI coding harness using less than 100 megabytes of RAM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050a08"/>
      <stop offset=".55" stop-color="#0a1612"/>
      <stop offset="1" stop-color="#07100d"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5ff52"/>
      <stop offset="1" stop-color="#55ffc4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07100d" stop-opacity="0"/>
      <stop offset=".68" stop-color="#07100d" stop-opacity=".7"/>
      <stop offset="1" stop-color="#07100d"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ceff54" stroke-opacity=".045"/>
      <circle cx="1" cy="1" r="1" fill="#ceff54" fill-opacity=".15"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H1200" stroke="#d8ff75" stroke-opacity=".025"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1164" height="594" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#020503"/>
  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1164" height="594" fill="url(#bg)"/>
    <ellipse cx="975" cy="180" rx="300" ry="220" fill="#55ffc4" fill-opacity=".07" filter="url(#blur)"/>
    <ellipse cx="275" cy="650" rx="400" ry="180" fill="#ddff4f" fill-opacity=".06" filter="url(#blur)"/>
    <rect x="18" y="18" width="1164" height="594" fill="url(#grid)"/>

    <rect x="18" y="18" width="1164" height="594" fill="url(#fade)"/>
    <path d="M788-100 488 730" stroke="#cfff50" stroke-opacity=".05" stroke-width="100"/>
    <path d="M863-100 563 730" stroke="#55ffc4" stroke-opacity=".045" stroke-width="2"/>

    <g transform="translate(76 76)">
      <g transform="translate(0 1)" filter="url(#glow)">
        <path d="M24 0 0 36h19L8 70l46-44H33L49 0Z" fill="url(#acid)"/>
      </g>
      <text x="72" y="48" fill="#f1f7f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="43" font-weight="900" letter-spacing="3">BLITZDENK</text>
      <text x="348" y="48" fill="#dfff50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="43" font-weight="900">_</text>
    </g>

    <g transform="translate(76 230)" font-family="Arial, Helvetica, sans-serif" font-weight="900">
      <text fill="#f3f7f0" font-size="53" letter-spacing="-1.7">THE TINY HARNESS THAT <tspan fill="url(#acid)">SHAPES ITSELF</tspan></text>
      <text y="61" fill="#f3f7f0" font-size="53" letter-spacing="-1.7">TO YOUR PROJECT.</text>
    </g>

    <g transform="translate(78 355)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text fill="#dfff50" font-size="21" font-weight="900">1.7 MB</text>
      <text x="103" fill="#63776d" font-size="21">/</text>
      <text x="126" fill="#dfff50" font-size="21" font-weight="900">&lt;100 MB RAM</text>
    </g>

    <g transform="translate(78 546)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
      <text fill="#dfff50" font-size="21">POSIX  ·  ANY PROVIDER  ·  SSH  ·  LUA  ·  HOT RELOAD  ·  MCP  ·  SKILLS  ·  MERMAID</text>
      <text y="30" fill="#71837a" font-size="21" letter-spacing=".5">NO DEPS  /  NO SUPPLY CHAIN  /  ALL NATIVE</text>
    </g>
    <rect x="18" y="18" width="1164" height="594" fill="url(#scan)" pointer-events="none"/>
  </g>
  <rect x="18.5" y="18.5" width="1163" height="593" rx="19.5" fill="none" stroke="#cfff50" stroke-opacity=".22"/>
  <path d="M18 63V38a20 20 0 0 1 20-20h25M1137 612h25a20 20 0 0 0 20-20v-25" fill="none" stroke="#dfff50" stroke-width="2"/>
</svg>

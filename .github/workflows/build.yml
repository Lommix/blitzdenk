name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          cache-size-limit: 4096
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall -Dversion="${GITHUB_REF_NAME#v}" -j1
      - name: rename binary
        run: mv zig-out/bin/blitz zig-out/bin/blitz-${{ matrix.target }}
      - name: gzip binary
        run: gzip zig-out/bin/blitz-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: blitz-${{ matrix.target }}
          path: zig-out/bin/blitz-${{ matrix.target }}.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: blitz-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: blitz-*.gz
